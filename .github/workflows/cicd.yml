name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage (AWS S3), pull du lieu bang DVC, huan luyen mo hinh,
  # upload model vao vung staging cua commit nay.
  # Model chi duoc promote len artifacts/current/ o job Release (sau quality gate),
  # de mot model khong dat nguong khong bao gio ghi de model dang phuc vu.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS = {"aws_access_key_id":"...","aws_secret_access_key":"..."}
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for key in ("aws_access_key_id", "aws_secret_access_key"):
                  print(f"::add-mask::{creds[key]}")
                  f.write(f"{key.upper()}={creds[key]}\n")
          PYEOF
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          STAGING_KEY: artifacts/staging/${{ github.sha }}/model.joblib
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          key = os.environ["STAGING_KEY"]
          boto3.client("s3").upload_file("models/model.joblib", bucket, key)
          print(f"Uploaded models/model.joblib -> s3://{bucket}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          THRESHOLD = 0.65
          f1 = float(os.environ["F1"])  # output cua job la chuoi, can ep kieu
          if f1 < THRESHOLD:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {THRESHOLD}. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= {THRESHOLD}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Promote model tu staging len artifacts/current/, roi trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Promote model to artifacts/current
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          STAGING_KEY: artifacts/staging/${{ github.sha }}/model.joblib
          CURRENT_KEY: artifacts/current/model.joblib
        run: |
          python3 -m pip install -q boto3
          python3 - <<'PYEOF'
          import json, os
          import boto3

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          s3 = boto3.client("s3", region_name=os.environ["AWS_REGION"], **creds)
          bucket = os.environ["ARTIFACT_BUCKET"]
          src, dst = os.environ["STAGING_KEY"], os.environ["CURRENT_KEY"]
          s3.copy_object(Bucket=bucket, Key=dst, CopySource={"Bucket": bucket, "Key": src})
          print(f"Promoted s3://{bucket}/{src} -> s3://{bucket}/{dst}")
          PYEOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo
                echo "Health check passed."
                exit 0
              fi
              echo "Server chua san sang (lan thu $i)..."
            done
            echo "Health check failed."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
